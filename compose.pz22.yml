name: pz22
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${PZ22_POSTGRES_DB:?Set PZ22_POSTGRES_DB}
      POSTGRES_USER: ${PZ22_POSTGRES_USER:?Set PZ22_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PZ22_POSTGRES_PASSWORD:?Set PZ22_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
